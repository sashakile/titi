name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: |
          dotnet restore src/titi/titi.csproj
          dotnet restore test/titi/titi.Tests.csproj
        env:
          CI: true

      - name: Build
        run: |
          dotnet build src/titi/titi.csproj --no-restore --configuration Release
          dotnet build test/titi/titi.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test test/titi/titi.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
