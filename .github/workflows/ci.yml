name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        env:
          CI: true
        run: |
          dotnet restore src/titi/titi.csproj --locked-mode
          dotnet restore test/titi/titi.Tests.csproj --locked-mode
          dotnet restore test/titi/titi.Tests.csproj

      - name: Build
        run: |
          dotnet build src/titi/titi.csproj --no-restore --configuration Release
          dotnet build test/titi/titi.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test test/titi/titi.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage"

      - name: Pack & validate tool installation
        run: |
          dotnet pack src/titi/titi.csproj --no-build --configuration Release -o dist/nupkg
          nupkg=$(ls dist/nupkg/*.nupkg | head -1)
          echo "Testing package: $nupkg"
          # Install in a temp dir and run --help
          temp_dir=$(mktemp -d)
          dotnet tool install titi --add-source "$PWD/dist/nupkg" --tool-path "$temp_dir"
          $temp_dir/titi --help
          echo "✅ Package validated successfully"
          rm -rf "$temp_dir"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: '**/coverage.cobertura.xml'
          fail_ci_if_error: false
