name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'openspec/specs/**'
      - 'src/titi/**'
  pull_request:
    paths:
      - 'docs/**'
      - 'openspec/specs/**'
      - 'src/titi/**'
  workflow_dispatch:

# Deploy permissions only for push-to-main deployments
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dotnet tools
        run: dotnet tool restore
      - name: Build docs
        run: |
          rm -rf docs/specs
          mkdir -p docs/specs
          cp -r openspec/specs/* docs/specs/
          cp docs/specs-toc.yml docs/specs/toc.yml
          dotnet docfx docs/docfx.json --output docs
      - name: Apply custom styles
        run: |
          cp docs/styles/* docs/_site/styles/
      - name: Upload Pages artifact
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
